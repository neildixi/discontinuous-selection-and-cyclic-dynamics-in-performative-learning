[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynafront"
version = "0.1.0"
description = "Discontinuous selection and cyclic dynamics in performative learning"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Neil Dixit" }]
requires-python = ">=3.10"
keywords = ["performative learning", "feedback", "dynamical systems"]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "pandas>=2.0,<4",
  "matplotlib>=3.7,<4",
  "pyyaml>=6.0,<7",
  "tqdm>=4.65,<5",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6.25",
  "nbclient>=0.9",
  "nbformat>=5.9",
]
test = [
  "pytest>=7.4",
]

[project.scripts]
dynafront = "dynafront.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
