name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit tests
        run: python -m pytest
      - name: Verify cached manifest
        run: python -m dynafront.cli verify-cached
      - name: Quick reproduction
        run: python -m dynafront.cli reproduce --mode quick --workers 1
